<svg width="100" height="60" viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45B7D1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="2" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Main container with rounded corners -->
  <rect x="2" y="6" width="96" height="28" rx="14" ry="14" 
        fill="url(#mainGradient)" 
        opacity="0.15" 
        filter="url(#shadow)"/>
  
  <!-- Letter S -->
  <g transform="translate(12, 20)">
    <path d="M -6 -8 C -6 -10 -4 -12 -2 -12 L 2 -12 C 4 -12 6 -10 6 -8 C 6 -6 4 -4 2 -4 L -2 -4 C -4 -4 -6 -2 -6 0 C -6 2 -4 4 -2 4 L 2 4 C 4 4 6 6 6 8 C 6 10 4 12 2 12 L -2 12 C -4 12 -6 10 -6 8" 
          stroke="url(#mainGradient)" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Letter K -->
  <g transform="translate(40, 20)">
    <path d="M -8 -10 L -8 10 M -8 0 L 8 -10 M -8 0 L 8 10" 
          stroke="url(#mainGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Letter T -->
  <g transform="translate(68, 20)">
    <path d="M -10 -8 L 10 -8 M 0 -8 L 0 10" 
          stroke="url(#mainGradient)" 
          stroke-width="3" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Accent elements -->
  <circle cx="90" cy="12" r="1.5" fill="#FF6B6B" opacity="0.8"/>
  <circle cx="85" cy="28" r="1" fill="#4ECDC4" opacity="0.6"/>
  <rect x="7" y="8" width="2" height="2" rx="1" fill="#45B7D1" opacity="0.7"/>
</svg>